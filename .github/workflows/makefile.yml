name: Code check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 clang-format-19 clang-tidy-19 make

      - name: Run make check
        run: make check CLANG_FORMAT=clang-format-19 CLANG_TIDY=clang-tidy-19

      - name: Run CMocka tests
        run: make test
